name: Validate data

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate guides, the index, trust levels and jurisdiction routing
        run: npm run check
      - name: Check the downloadable skills
        run: python3 scripts/package-skill.py --check
